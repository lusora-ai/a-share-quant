[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant"
version = "0.1.0"
description = "面向个人散户的“研究优先、半自动执行”A股量化研究与选股系统"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Quant Engineer", email = "quant@example.com"}
]
keywords = ["quant", "a-share", "lightgbm", "backtest", "stock-selection"]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.2.0",
    "duckdb>=0.9.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "akshare>=1.12.0",
    "baostock>=0.8.8",
    "pyqlib>=0.9.7",
    "tables>=3.9.0",
    "cvxpy>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
ashare-quant = "ashare_quant.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
