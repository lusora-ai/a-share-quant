# LightGBM Model & Walk-Forward Configuration
model:
  type: "qlib_lgbm"  # Official Microsoft Qlib LGBModel
  objective: "regression" # regression to rank_label
  metric: "rmse"
  boosting_type: "gbdt"
  n_estimators: 300
  learning_rate: 0.03
  num_leaves: 31
  max_depth: 5
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  verbose: -1

label:
  name: "rank_label_5d"
  horizon: 5
  benchmark: "000300.SH" # 沪深300

walk_forward:
  train_years: 4
  val_years: 1
  test_years: 1
  start_year: 2018
  end_year: 2025
