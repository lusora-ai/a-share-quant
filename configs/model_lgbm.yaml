# LightGBM Model & Walk-Forward Configuration
model:
  type: "qlib_lgbm"  # Official Microsoft Qlib LGBModel
  objective: "regression" # regression to rank_label
  metric: "rmse"
  boosting_type: "gbdt"
  n_estimators: 300
  learning_rate: 0.03
  num_leaves: 31
  max_depth: 5
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  verbose: -1

label:
  horizon: 5
  benchmark: "000300.SH" # 沪深300
  # Alpha158 / Qlib handler pipeline label (single source of truth in code:
  # ashare_quant.features.qlib_alpha158.EXEC_LABEL_5D_*)
  alpha158:
    name: "exec_return_5d_cszscore"
    expression: "Ref($close, -5) / Ref($open, -1) - 1"
    signal_time: "t close"
    entry_time: "t+1 open"
    exit_time: "t+5 close"
    normalization: "qlib CSZScoreNorm (cross-sectional z-score; NOT percentile rank)"
  # Custom12 DataFrame pipeline label (generated by ExecutableLabel5D)
  custom12:
    name: "rank_label_5d"
    expression: "daily cross-section percentile rank of 5D executable excess return"

walk_forward:
  train_years: 4
  val_years: 1
  test_years: 1
  embargo_days: 2
  start_year: 2014   # experiment window start (must match available real provider data)
  end_year: 2020     # experiment window end (full calendar years)
